<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hanzi Pink Pastel</title>
  
  <!-- Font Quicksand bo tròn & Noto Sans SC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink-100: #FCEAF1;
      --pink-200: #F5D7E2;
      --pink-300: #F5BED2;
      --pink-400: #EBA3BD;
      --text-main: #543E48;
      --text-soft: #9E8591;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--pink-100);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .hanzi-font {
      font-family: 'Noto Sans SC', 'Quicksand', sans-serif;
    }

    /* Top Bar */
    .top-bar {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 0 4px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FFFFFF;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-soft);
      box-shadow: 0 4px 12px rgba(235, 163, 189, 0.15);
      border: 1px solid var(--pink-200);
    }
    .dot {
      width: 8px;
      height: 8px;
      background-color: #55BCA5;
      border-radius: 50%;
    }
    .btn-text {
      background: #FFFFFF;
      border: 1px solid var(--pink-200);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: var(--pink-400);
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(235, 163, 189, 0.15);
    }

    /* Settings Panel */
    .settings-panel {
      width: 100%;
      max-width: 420px;
      background: #FFFFFF;
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1.5px solid var(--pink-200);
      box-shadow: 0 8px 24px rgba(235, 163, 189, 0.18);
      display: none;
    }
    .settings-panel.active { display: block; }
    .input-row { display: flex; gap: 8px; margin-top: 6px; }

    /* Card Box */
    .card {
      width: 100%;
      max-width: 420px;
      background: #FFFFFF;
      border-radius: 32px;
      padding: 24px 20px;
      box-shadow: 0 12px 35px rgba(235, 163, 189, 0.25);
      border: 2px solid var(--pink-200);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid var(--pink-100);
      padding-bottom: 12px;
    }
    .tag-counter {
      background: var(--pink-100);
      color: var(--text-soft);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .tag-mode {
      background: #FFF0F5;
      color: var(--pink-400);
      border: 1px solid var(--pink-200);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    /* Prompt Display */
    .prompt-box { text-align: center; }
    .pinyin-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--pink-400);
      letter-spacing: 0.5px;
    }
    .meaning-subtitle {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      margin-top: 2px;
    }
    .sentence-bubble {
      margin-top: 12px;
      background: #FFF9FB;
      border: 1.5px dashed var(--pink-200);
      padding: 14px;
      border-radius: 20px;
      font-size: 19px;
      color: var(--text-main);
      font-weight: 600;
    }

    /* Input Section */
    .input-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-soft);
      text-align: center;
      margin-bottom: 6px;
      display: block;
    }
    .input-hanzi {
      width: 100%;
      background: #FFF9FB;
      border: 2px solid var(--pink-200);
      border-radius: 18px;
      padding: 11px 14px;
      font-size: 22px;
      text-align: center;
      color: var(--text-main);
      outline: none;
      transition: all 0.25s ease;
    }
    .input-hanzi::placeholder {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-soft);
      opacity: 0.75;
    }
    .input-hanzi:focus {
      background: #FFFFFF;
      border-color: var(--pink-400);
      box-shadow: 0 0 0 4px rgba(235, 163, 189, 0.25);
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .btn-primary {
      flex: 2;
      background: var(--pink-400);
      color: #FFFFFF;
      border: none;
      padding: 13px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(235, 163, 189, 0.45);
      transition: all 0.2s;
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary {
      flex: 1.2;
      background: #FFF3F7;
      border: 1.5px solid var(--pink-300);
      color: var(--pink-400);
      padding: 13px;
      border-radius: 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Result Box & Answer >200% */
    .result-box {
      border-top: 1.5px solid var(--pink-100);
      padding-top: 14px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    .result-box.active { display: flex; }

    .status-msg-wrap {
      text-align: center;
      padding: 12px;
      border-radius: 18px;
      border: 1.5px solid transparent;
    }
    .status-msg-wrap.correct {
      background: #EFF9F6;
      border-color: #BDE7DB;
    }
    .status-msg-wrap.wrong {
      background: #FFF2F6;
      border-color: var(--pink-200);
    }
    .answer-tag {
      font-size: 12px;
      font-weight: 700;
      display: block;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .answer-character-huge {
      font-size: 38px;
      font-weight: 700;
      line-height: 1.2;
      display: block;
      letter-spacing: 2px;
    }

    /* Khung rã từng chữ riêng biệt */
    .char-card {
      background: #FFF9FB;
      border: 1.5px solid var(--pink-200);
      border-radius: 20px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(235, 163, 189, 0.08);
    }
    .char-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1.5px dashed var(--pink-200);
      padding-bottom: 8px;
    }
    .char-huge-badge {
      font-size: 26px;
      font-weight: 700;
      color: var(--pink-400);
      line-height: 1;
    }
    .char-pinyin-badge {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-soft);
      background: #FFFFFF;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--pink-200);
    }
    .char-meaning-badge {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      margin-left: auto;
    }

    .section-tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--pink-400);
      display: block;
      margin-bottom: 3px;
    }

    .radicals-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .radical-item {
      background: #FFFFFF;
      border: 1px solid var(--pink-200);
      border-radius: 10px;
      padding: 4px 9px;
      font-size: 12px;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .radical-pinyin {
      font-size: 11px;
      font-weight: 700;
      color: var(--pink-400);
      background: #FFF2F6;
      padding: 1px 5px;
      border-radius: 6px;
    }

    .btn-next {
      width: 100%;
      background: #FFF3F7;
      border: 1.5px solid var(--pink-200);
      padding: 13px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-next:hover { background: var(--pink-200); }

    .loading-spinner {
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--pink-400);
      padding: 12px 0;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="badge">
      <span class="dot"></span>
      <span>Gemini 3.1 Flash Lite</span>
    </div>
    <button onclick="toggleSettings()" class="btn-text">⚙️ Cài đặt API</button>
  </div>

  <!-- Settings Panel -->
  <div id="settingsPanel" class="settings-panel">
    <div style="font-size: 12px; font-weight: 700; color: var(--text-soft); margin-bottom: 6px;">Gemini API Key</div>
    <div class="input-row">
      <input id="apiKeyInput" type="password" placeholder="Dán khóa API từ AI Studio..." style="flex:1; background:#FFF9FB; border:1.5px solid var(--pink-200); border-radius:14px; padding:10px 12px; font-size:13px; outline:none;" />
      <button onclick="saveApiKey()" style="background:var(--pink-400); color:#fff; border:none; border-radius:14px; padding:10px 16px; font-size:13px; font-weight:700;">Lưu</button>
    </div>
  </div>

  <!-- Main Flashcard -->
  <main class="card">
    <div class="card-header">
      <span id="cardCounter" class="tag-counter">Thẻ 1/5</span>
      <span class="tag-mode">Luyện Gboard</span>
    </div>

    <div class="prompt-box">
      <div id="promptPinyin" class="pinyin-title">qīng chu</div>
      <div id="promptMeaning" class="meaning-subtitle">Rõ ràng, hiểu rõ</div>
      <div id="promptSentence" class="sentence-bubble hanzi-font">这个问题你听 [ ? ] 了吗？</div>
    </div>

    <div>
      <label class="input-label">Gõ Pinyin và chọn chữ Hán từ Gboard:</label>
      <input id="hanziInput" type="text" placeholder="Chạm để nhập đáp án" class="input-hanzi hanzi-font" autocomplete="off" autocorrect="off" autocapitalize="off" />
      
      <div class="btn-group">
        <button onclick="checkAnswer()" class="btn-primary">Kiểm tra</button>
        <button onclick="requestDeconstruction()" class="btn-secondary">✨ Rã chữ</button>
      </div>
    </div>

    <!-- AI & Result Area -->
    <div id="resultBox" class="result-box">
      <div id="statusWrap" class="status-msg-wrap">
        <span id="statusTag" class="answer-tag"></span>
        <span id="bigHanziResult" class="answer-character-huge hanzi-font"></span>
      </div>

      <div id="loadingAi" class="loading-spinner">
        Đang tách từng chữ, bộ thủ và pinyin...
      </div>

      <!-- Danh sách từng chữ được rã riêng biệt -->
      <div id="charactersContainer" style="display:none; flex-direction:column; gap:10px;"></div>

      <button onclick="nextCard()" class="btn-next">Từ tiếp theo ➔</button>
    </div>
  </main>

  <script>
    const MODEL_ID = "gemini-2.0-flash"; 

    // Vốn từ giao tiếp người học đã biết
    const knownWords = ["水", "木", "青", "日", "月", "看", "说", "车", "大", "家", "学", "林", "疋"];

    const cards = [
      { character: "清楚", pinyin: "qīng chu", meaning: "Rõ ràng, hiểu rõ", sentence: "这个问题你听 [ ? ] 了吗？" },
      { character: "经理", pinyin: "jīng lǐ", meaning: "Giám đốc, quản lý", sentence: "这位是我们的新 [ ? ]。" },
      { character: "简单", pinyin: "jiǎn dān", meaning: "Đơn giản", sentence: "这个汉字其实很 [ ? ]。" },
      { character: "环境", pinyin: "huán jìng", meaning: "Môi trường", sentence: "这里的 [ ? ] 非常安静。" },
      { character: "决定", pinyin: "jué dìng", meaning: "Quyết định", sentence: "我已经 [ ? ] 明天去北京。" }
    ];

    let currentIndex = 0;

    document.addEventListener("DOMContentLoaded", () => {
      const savedKey = localStorage.getItem("gemini_api_key");
      if (savedKey) document.getElementById("apiKeyInput").value = savedKey;
      renderCard();
    });

    function toggleSettings() {
      document.getElementById("settingsPanel").classList.toggle("active");
    }

    function saveApiKey() {
      const key = document.getElementById("apiKeyInput").value.trim();
      localStorage.setItem("gemini_api_key", key);
      toggleSettings();
      alert("Đã lưu API Key thành công!");
    }

    function renderCard() {
      const card = cards[currentIndex];
      document.getElementById("cardCounter").innerText = `Thẻ ${currentIndex + 1}/${cards.length}`;
      document.getElementById("promptPinyin").innerText = card.pinyin;
      document.getElementById("promptMeaning").innerText = card.meaning;
      document.getElementById("promptSentence").innerText = card.sentence;
      
      const input = document.getElementById("hanziInput");
      input.value = "";
      input.style.borderColor = "var(--pink-200)";
      input.style.backgroundColor = "#FFF9FB";
      input.focus();

      document.getElementById("resultBox").classList.remove("active");
      document.getElementById("charactersContainer").style.display = "none";
      document.getElementById("loadingAi").style.display = "none";
    }

    function checkAnswer() {
      const inputVal = document.getElementById("hanziInput").value.trim();
      const currentCard = cards[currentIndex];
      const resultBox = document.getElementById("resultBox");
      const statusWrap = document.getElementById("statusWrap");
      const statusTag = document.getElementById("statusTag");
      const bigHanziResult = document.getElementById("bigHanziResult");
      const input = document.getElementById("hanziInput");

      resultBox.classList.add("active");

      if (inputVal === currentCard.character) {
        input.style.borderColor = "#55BCA5";
        input.style.backgroundColor = "#EFF9F6";
        statusWrap.className = "status-msg-wrap correct";
        statusTag.style.color = "#368D78";
        statusTag.innerText = "✓ Chính xác";
        bigHanziResult.style.color = "#287563";
        bigHanziResult.innerText = currentCard.character;
      } else {
        input.style.borderColor = "var(--pink-400)";
        input.style.backgroundColor = "#FFF2F6";
        statusWrap.className = "status-msg-wrap wrong";
        statusTag.style.color = "var(--pink-400)";
        statusTag.innerText = "Chưa chính xác • Đáp án đúng:";
        bigHanziResult.style.color = "var(--pink-400)";
        bigHanziResult.innerText = currentCard.character;
        requestDeconstruction();
      }
    }

    async function requestDeconstruction() {
      const apiKey = localStorage.getItem("gemini_api_key");
      if (!apiKey) {
        alert("Vui lòng chạm 'Cài đặt API' để dán API Key trước!");
        toggleSettings();
        return;
      }

      document.getElementById("resultBox").classList.add("active");
      document.getElementById("loadingAi").style.display = "block";
      document.getElementById("charactersContainer").style.display = "none";

      const card = cards[currentIndex];

      const promptPayload = {
        contents: [{
          parts: [{
            text: `Phân tích cụm từ Hán tự: "${card.character}". 
QUY TẮC BẮT BUỘC: 
- Tách riêng TỪNG CHỮ HÁN đơn lẻ để phân tích độc lập. Không gộp từ.
- Với mỗi bộ thủ cấu thành: BẮT BUỘC phải kèm theo Pinyin chuẩn có dấu của bộ thủ đó.
- Tạo câu chuyện chiết tự thị giác 1-2 câu súc tích.
- Liên kết với từ đã biết trong kho: ${JSON.stringify(knownWords)}.`
          }]
        }],
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: {
            type: "OBJECT",
            properties: {
              characters_breakdown: {
                type: "ARRAY",
                items: {
                  type: "OBJECT",
                  properties: {
                    char: { type: "STRING" },
                    pinyin: { type: "STRING" },
                    meaning: { type: "STRING" },
                    radicals: {
                      type: "ARRAY",
                      items: {
                        type: "OBJECT",
                        properties: {
                          radical: { type: "STRING" },
                          pinyin: { type: "STRING" },
                          name: { type: "STRING" },
                          meaning: { type: "STRING" }
                        },
                        required: ["radical", "pinyin", "name", "meaning"]
                      }
                    },
                    visual_story: { type: "STRING" },
                    connection: { type: "STRING" }
                  },
                  required: ["char", "pinyin", "meaning", "radicals", "visual_story", "connection"]
                }
              }
            },
            required: ["characters_breakdown"]
          }
        }
      };

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_ID}:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(promptPayload)
        });

        if (!response.ok) {
          const errBody = await response.json();
          throw new Error(`Google API (${response.status}): ${errBody.error?.message || response.statusText}`);
        }

        const data = await response.json();
        const parsed = JSON.parse(data.candidates[0].content.parts[0].text);
        renderAiResult(parsed.characters_breakdown);
      } catch (err) {
        alert("Lỗi gọi API: " + err.message);
      } finally {
        document.getElementById("loadingAi").style.display = "none";
      }
    }

    function renderAiResult(characters) {
      const container = document.getElementById("charactersContainer");
      
      container.innerHTML = characters.map(item => `
        <div class="char-card">
          <!-- Header riêng từng chữ -->
          <div class="char-card-header">
            <span class="char-huge-badge hanzi-font">${item.char}</span>
            <span class="char-pinyin-badge">${item.pinyin}</span>
            <span class="char-meaning-badge">${item.meaning}</span>
          </div>

          <!-- Bộ thủ cấu thành (đã có thêm Pinyin) -->
          <div>
            <span class="section-tag">Bộ thủ cấu thành</span>
            <div class="radicals-wrap">
              ${item.radicals.map(r => `
                <div class="radical-item">
                  <strong class="hanzi-font" style="color:var(--pink-400); font-size:14px;">${r.radical}</strong> 
                  <span class="radical-pinyin">${r.pinyin}</span>
                  <span>${r.name}: ${r.meaning}</span>
                </div>
              `).join("")}
            </div>
          </div>

          <!-- Câu chuyện chiết tự -->
          <div>
            <span class="section-tag">Hình ảnh chiết tự</span>
            <p style="color:var(--text-main); font-size:13px; font-weight:500; line-height:1.45;">${item.visual_story}</p>
          </div>

          <!-- Liên kết từ đã biết -->
          <div>
            <span class="section-tag">Liên kết từ đã biết</span>
            <p style="color:var(--text-main); font-size:13px; font-weight:500; line-height:1.45;">${item.connection}</p>
          </div>
        </div>
      `).join("");

      container.style.display = "flex";
    }

    function nextCard() {
      currentIndex = (currentIndex + 1) % cards.length;
      renderCard();
    }
  </script>
</body>
</html>
